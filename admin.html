<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DuMotos — Área Administrativa</title>
<link rel="stylesheet" href="style.css">
<style>
.admin{max-width:900px;margin:0 auto;padding:70px 24px}
.panel{background:#101010;border:1px solid #292929;border-radius:16px;padding:32px;margin:25px 0}
.form{display:grid;gap:15px}
.form label{font-weight:700;color:#aaa;font-size:14px}
.form input,.form textarea{width:100%;box-sizing:border-box;background:#070707;border:1px solid #444;border-radius:8px;padding:15px;color:#fff;font:inherit}
.form textarea{min-height:110px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.item{display:flex;gap:15px;align-items:center;border-bottom:1px solid #292929;padding:15px 0}
.item img{width:90px;height:70px;object-fit:cover;border-radius:8px}
.danger{background:#2b0b0b;border:1px solid #6d2222}
.status{margin-top:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><img src="logo.png" alt="DuMotos"></a>
  <span class="admin-link">PAINEL ADMINISTRATIVO</span>
</header>

<main class="admin">
  <div class="eyebrow">ADMIN</div>
  <h1>Gerenciar DuMotos</h1>

  <div id="login" class="panel">
    <h2>Acesso administrativo</h2>
    <p class="muted">Entre com o e-mail e a senha da conta administrativa do Supabase.</p>
    <div class="form">
      <input id="email" type="email" placeholder="Seu e-mail">
      <input id="senha" type="password" placeholder="Senha">
      <button class="btn primary" onclick="entrar()">ENTRAR</button>
      <p id="loginStatus" class="status muted"></p>
    </div>
  </div>

  <div id="painel" style="display:none">
    <div class="panel">
      <h2>Adicionar moto ao estoque</h2>
      <div class="form">
        <div class="row">
          <div><label>Marca</label><input id="marca" placeholder="Honda"></div>
          <div><label>Modelo</label><input id="modelo" placeholder="CG 160 Start"></div>
        </div>
        <div class="row">
          <div><label>Ano</label><input id="ano" type="number" placeholder="2024"></div>
          <div><label>Quilometragem</label><input id="km" placeholder="18.000 km"></div>
        </div>
        <div><label>Preço</label><input id="preco" type="number" step="0.01" placeholder="15990"></div>
        <div><label>Descrição</label><textarea id="desc" placeholder="Detalhes da moto..."></textarea></div>
        <div><label>Foto</label><input id="foto" type="file" accept="image/*"></div>
        <button class="btn primary" onclick="cadastrar()">CADASTRAR MOTO</button>
        <p id="status" class="status muted"></p>
      </div>
    </div>

    <div class="panel">
      <h2>Motos cadastradas</h2>
      <div id="lista"></div>
      <button class="btn ghost" onclick="sair()">SAIR</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://snwsdunvhfudbwclrezy.supabase.co";
const SUPABASE_KEY = "sb_publishable_Z6iA4qATzZBjIbOJUO5LLQ_jBG7KdVr";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",""":"&quot;"}[c]));
}
function setStatus(text, error=false) {
  $("status").textContent = text;
  $("status").style.color = error ? "#ff8b8b" : "";
}
function setLoginStatus(text, error=false) {
  $("loginStatus").textContent = text;
  $("loginStatus").style.color = error ? "#ff8b8b" : "";
}

async function entrar() {
  const email = $("email").value.trim();
  const password = $("senha").value;
  if (!email || !password) return setLoginStatus("Digite e-mail e senha.", true);

  setLoginStatus("Entrando...");
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) return setLoginStatus("E-mail ou senha incorretos.", true);

  $("login").style.display = "none";
  $("painel").style.display = "block";
  carregarLista();
}

async function sair() {
  await supabaseClient.auth.signOut();
  location.reload();
}

async function cadastrar() {
  const user = (await supabaseClient.auth.getUser()).data.user;
  if (!user) return;

  const marca = $("marca").value.trim();
  const modelo = $("modelo").value.trim();
  const ano = Number($("ano").value);
  const km = $("km").value.trim();
  const preco = Number($("preco").value);
  const descricao = $("desc").value.trim();
  const file = $("foto").files[0];

  if (!marca || !modelo || !ano || !preco) {
    return setStatus("Preencha marca, modelo, ano e preço.", true);
  }

  setStatus("Salvando moto...");
  let photo_url = "";

  if (file) {
    const safeName = file.name.toLowerCase().replace(/[^a-z0-9._-]/g, "-");
    const path = `${crypto.randomUUID()}-${safeName}`;
    const { error: uploadError } = await supabaseClient.storage.from("Motos").upload(path, file, { upsert: false });
    if (uploadError) return setStatus("Erro ao enviar a foto: " + uploadError.message, true);

    const { data: publicData } = supabaseClient.storage.from("Motos").getPublicUrl(path);
    photo_url = publicData.publicUrl;
  }

  const { error } = await supabaseClient.from("motos").insert({
    marca, modelo, ano, km, preco, descricao, photo_url, disponivel: true
  });

  if (error) return setStatus("Erro ao cadastrar: " + error.message, true);

  ["marca","modelo","ano","km","preco","desc","foto"].forEach(id => $(id).value = "");
  setStatus("Moto cadastrada com sucesso!");
  carregarLista();
}

async function carregarLista() {
  const { data, error } = await supabaseClient
    .from("motos")
    .select("id,marca,modelo,ano,km,preco,photo_url,disponivel")
    .order("created_at", { ascending: false });

  if (error) {
    $("lista").innerHTML = `<p class="muted">Erro ao carregar: ${escapeHtml(error.message)}</p>`;
    return;
  }

  $("lista").innerHTML = data.length ? data.map(m => `
    <div class="item">
      ${m.photo_url ? `<img src="${escapeHtml(m.photo_url)}" alt="">` : "<div>🏍️</div>"}
      <div style="flex:1">
        <b>${escapeHtml(m.marca)} ${escapeHtml(m.modelo)}</b>
        <p class="muted">${escapeHtml(m.ano)} • ${escapeHtml(m.km || "")} • R$ ${Number(m.preco || 0).toLocaleString("pt-BR",{minimumFractionDigits:2})}</p>
      </div>
      <button class="btn danger" onclick="remover('${m.id}')">EXCLUIR</button>
    </div>`).join("") : "<p class='muted'>Nenhuma moto cadastrada.</p>";
}

async function remover(id) {
  if (!confirm("Excluir esta moto do estoque?")) return;
  setStatus("Excluindo...");
  const { error } = await supabaseClient.from("motos").delete().eq("id", id);
  if (error) return setStatus("Erro ao excluir: " + error.message, true);
  setStatus("Moto excluída.");
  carregarLista();
}

async function iniciar() {
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) {
    $("login").style.display = "none";
    $("painel").style.display = "block";
    carregarLista();
  }
}
iniciar();
</script>
</body>
</html>
