<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DuMotos — Área Administrativa</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:900px;margin:0 auto;padding:70px 24px}.panel{background:#101010;border:1px solid #292929;border-radius:16px;padding:32px;margin:25px 0}.form{display:grid;gap:15px}.form label{font-weight:700;color:#aaa;font-size:14px}.form input,.form textarea{width:100%;background:#070707;border:1px solid #444;border-radius:8px;padding:15px;color:#fff;font:inherit}.form textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.danger{background:#2b0b0b;border:1px solid #6d2222}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><img src="logo.png" alt="DuMotos"></a><span class="admin-link">PAINEL ADMINISTRATIVO</span></header><main class="admin"><div class="eyebrow">ADMIN</div><h1>Gerenciar DuMotos</h1><div id="login" class="panel"><h2>Acesso administrativo</h2><p class="muted">Protótipo local: escolha uma senha para este navegador.</p><div class="form"><input id="senha" type="password" placeholder="Senha"><button class="btn primary" onclick="entrar()">ENTRAR</button></div></div><div id="painel" style="display:none"><div class="panel"><h2>Adicionar moto ao estoque</h2><div class="form"><div class="row"><div><label>Marca</label><input id="marca" placeholder="Honda"></div><div><label>Modelo</label><input id="modelo" placeholder="CG 160 Start"></div></div><div class="row"><div><label>Ano</label><input id="ano" placeholder="2024"></div><div><label>Quilometragem</label><input id="km" placeholder="18.000 km"></div></div><div><label>Preço</label><input id="preco" placeholder="15.990"></div><div><label>Descrição</label><textarea id="desc" placeholder="Detalhes da moto..."></textarea></div><div><label>Foto</label><input id="foto" type="file" accept="image/*"></div><button class="btn primary" onclick="cadastrar()">CADASTRAR MOTO</button></div></div><div class="panel"><h2>Motos cadastradas</h2><div id="lista"></div><button class="btn ghost" onclick="sair()">SAIR</button></div></div></main><script>
function entrar(){const s=document.getElementById("senha").value;if(!s)return;if(!localStorage.getItem("dumotos_senha"))localStorage.setItem("dumotos_senha",s);if(s===localStorage.getItem("dumotos_senha")){sessionStorage.setItem("dumotos_admin","1");mostrar()}else alert("Senha incorreta.");}
function mostrar(){if(sessionStorage.getItem("dumotos_admin")==="1"){login.style.display="none";painel.style.display="block";render()}}
function sair(){sessionStorage.removeItem("dumotos_admin");location.reload()}
function cadastrar(){const file=foto.files[0];const save=(photo)=>{const arr=JSON.parse(localStorage.getItem("dumotos_motos")||"[]");arr.push({marca:marca.value,modelo:modelo.value,ano:ano.value,km:km.value,preco:preco.value,desc:desc.value,photo});localStorage.setItem("dumotos_motos",JSON.stringify(arr));document.querySelectorAll("#painel input,#painel textarea").forEach(x=>x.value="");render();alert("Moto cadastrada!")};if(file){const r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(file)}else save("")}
function render(){const arr=JSON.parse(localStorage.getItem("dumotos_motos")||"[]");lista.innerHTML=arr.length?arr.map((m,i)=>`<div class="panel"><b>${m.marca} ${m.modelo}</b><p class="muted">${m.ano} • ${m.km||""} • R$ ${m.preco}</p><button class="btn danger" onclick="remover(${i})">EXCLUIR</button></div>`).join(""):"<p class='muted'>Nenhuma moto cadastrada.</p>"}
function remover(i){const a=JSON.parse(localStorage.getItem("dumotos_motos")||"[]");a.splice(i,1);localStorage.setItem("dumotos_motos",JSON.stringify(a));render()}
mostrar();
</script></body></html>
